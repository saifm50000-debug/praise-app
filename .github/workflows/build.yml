name: Build Kivy APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # خطوة ذكية لتغيير اسم البرنامج تلقائياً قبل بناء الـ APK
      - name: Change App Title
        run: |
          buildozer init
          sed -i 's/title = My Application/title = The Praise App the first saif android app/g' buildozer.spec

      - name: Build APK with Buildozer
        uses: ArtemSsh/buildozer-action@v1
        with:
          buildozer_version: stable
          command: android debug
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Kivy-APK
          path: bin/*.apk
